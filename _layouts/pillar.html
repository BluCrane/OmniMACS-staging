---
layout: default
---
<!-- Pillar Hero Section -->
<section class="pillar-hero bg-light py-5 text-center">
    <div class="container">
        <i class="{{ page.icon }} fa-3x text-primary mb-3"></i>
        <h1 class="display-4 fw-bold text-dark">{{ page.title }}</h1>
        <p class="lead text-muted">{{ page.subtitle }}</p>
        <a href="#contact" class="btn btn-primary btn-lg mt-3">Discuss Your {{ page.title | split: " " | first }} Needs</a>
    </div>
</section>

<!-- Pillar Content (This pulls everything below the dashes in your .md file) -->
<main>
    {{ content }}
</main>
