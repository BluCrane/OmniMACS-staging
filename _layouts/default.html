<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: "OmniMACS" }}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<!-- Custom CSS from mockup -->
	<link rel="stylesheet" href="{{ '/stylesheets/style.css' | relative_url }}">
	<!-- favicon -->
	<link rel="icon" href="/favicon.ico" type="image/x-icon">
</head>
<body>

    <!-- Global Navigation (Header) -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="https://blucrane.github.io/OmniMACS-staging/"><i class="fa-solid fa-chart-line text-primary me-2" style="color: var(--brand-primary) !important;"></i>OmniMACS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item"><a class="nav-link" href="https://blucrane.github.io/OmniMACS-staging/strategy/">Strategy</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Architecture</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Growth Engines</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                    <li class="nav-item ms-lg-3"><a class="nav-link btn-brand-primary" href="#" style="padding: 0.5rem 1rem;">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Jekyll Content Injection -->
    <main style="padding-top: 0;">
        {{ content }}
    </main>

    <!-- Global Footer -->
    <footer class="site-footer">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-4 mb-3 mb-md-0 text-center text-md-start">
                    <a href="#" class="text-white text-decoration-none fw-bold fs-4"><i class="fa-solid fa-chart-line me-2" style="color: var(--brand-primary);"></i>OmniMACS</a>
                </div>
                <div class="col-md-8 text-center text-md-end">
                    <a href="/strategy/" class="footer-link">Strategy</a>
                    <a href="#" class="footer-link">Architecture</a>
                    <a href="#" class="footer-link">Growth Engines</a>
                    <a href="#" class="footer-link">Privacy Policy</a>
                    <a href="#" class="footer-link"><i class="fa-brands fa-linkedin fs-5 align-middle"></i> LinkedIn</a>
                </div>
            </div>
            <hr style="border-color: #4a5568; margin: 2rem 0;">
            <div class="text-center text-muted small">
                © 2026 OmniMACS. All rights reserved.
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
